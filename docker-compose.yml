name: proyecto-taller-de-grado

services:
  postgres:
    image: postgres:16-alpine
    container_name: ajedrez-postgres
    environment:
      POSTGRES_DB: ajedrez
      POSTGRES_USER: ajedrez
      POSTGRES_PASSWORD: ajedrez
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init-db.sql:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ajedrez -d ajedrez"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: ajedrez-backend
    environment:
      DATABASE_URL: postgresql+psycopg2://ajedrez:ajedrez@postgres:5432/ajedrez
      PYTHONDONTWRITEBYTECODE: 1
      PYTHONUNBUFFERED: 1
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend:/app/backend:ro
      - ./training/__init__.py:/app/training/__init__.py:ro
      - ./training/data_pipeline.py:/app/training/data_pipeline.py:ro
      - ./training/checkpoints:/app/training/checkpoints:ro
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: ajedrez-frontend
    ports:
      - "8080:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data: